name: Embed check

# Run by hand. Read-only: opens a public note with a YouTube link and records the player. Nothing is published.
on:
  workflow_dispatch:
    inputs:
      pattern:
        description: Regex for the video link to look for (default YouTube)
        required: false

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: pip install --quiet websockets pillow
      - env:
          VIDEO_PATTERN: ${{ inputs.pattern }}
        run: mkdir -p smoke && python3 scripts/find-video-note.py > smoke/note.txt && cat smoke/note.txt
      - run: ./gradlew assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/embed-check.sh
