name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.STRUTHIO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.STRUTHIO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "STRUTHIO_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Set version
        run: |
          echo "STRUTHIO_VERSION_CODE=$(( ($(date +%s) - 1700000000) / 60 ))" >> "$GITHUB_ENV"
          echo "STRUTHIO_VERSION_NAME=0.1.0-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          STRUTHIO_KEYSTORE_PASSWORD: ${{ secrets.STRUTHIO_KEYSTORE_PASSWORD }}
          STRUTHIO_KEY_ALIAS: ${{ secrets.STRUTHIO_KEY_ALIAS }}
          STRUTHIO_KEY_PASSWORD: ${{ secrets.STRUTHIO_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Report APK sizes
        if: success()
        run: |
          {
            echo "### APK sizes"
            echo '| APK | Size |'
            echo '|---|---|'
            for f in app/build/outputs/apk/release/*.apk; do
              printf '| %s | %s KB |\n' "$(basename "$f")" "$(( $(stat -c %s "$f") / 1024 ))"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: struthio-apks
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
