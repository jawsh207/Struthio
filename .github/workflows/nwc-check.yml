name: Wallet relay check

# Read-only: opens the subscriptions Struthio uses for wallet answers and reports what relays send back.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet websockets
      - run: python3 scripts/nwc-check.py
