name: New kinds check

# Run by hand. Read-only: finds public picture, video, article and linked-account events and shows how Struthio displays them. Nothing is published.
on:
  workflow_dispatch:

jobs:
  kinds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: pip install --quiet websockets pillow
      - run: |
          mkdir -p smoke
          for k in 20 21 22 30023 10011; do python3 scripts/find-event.py $k > smoke/kind-$k.txt || true; done
          head -c 200 smoke/kind-*.txt
      - run: ./gradlew assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/kinds-check.sh
